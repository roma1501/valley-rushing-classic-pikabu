<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Салки в долине</title>
    <link rel="icon" type="image/png" href="assets/branding/icon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #8fc3e0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        @font-face { font-family: 'RushFont'; src: url('assets/fonts/montserrat.ttf?v=0.1.4') format('truetype'); font-weight: 100 900; font-display: swap; }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2.4vh, 18px);
            background: linear-gradient(#2f86e8 0%, #62adf2 42%, #c9ecfd 70%, #4caf3e 70.2%, #3f9a33 100%);
            z-index: 1000;
            overflow: hidden;
            font-family: RushFont, system-ui, sans-serif;
        }
        #loading-screen::before {
            content: ''; position: absolute; left: 0; right: 0; top: 70%; bottom: 0; pointer-events: none;
            background-image: radial-gradient(circle at 40% 38%, rgba(255,255,255,.28) 0 22%, rgba(0,0,0,.12) 34%, transparent 36%);
            background-size: 34px 34px;
        }
        .loading-cloud { position: absolute; width: 180px; height: 54px; background: #fff; border-radius: 40px; opacity: .9; pointer-events: none; animation: rv-cloud 26s linear infinite; }
        .loading-cloud::before { content: ''; position: absolute; width: 90px; height: 70px; left: 30px; top: -34px; background: #fff; border-radius: 50%; }
        .loading-cloud.c2 { top: 12%; transform: scale(.7); animation-duration: 34s; animation-delay: -12s; }
        .loading-cloud.c1 { top: 24%; animation-delay: -4s; }
        @keyframes rv-cloud { from { left: -220px; } to { left: 110%; } }
        .loading-text {
            font: 700 15px RushFont, system-ui, sans-serif;
            color: #fff;
            text-align: center;
            min-height: 1em;
            position: relative;
            text-shadow: 0 2px 0 #161a22, 0 0 6px rgba(0,0,0,.35);
        }
        .loading-bar {
            position: relative;
            width: min(340px, 78vw);
            height: 22px;
            background: #1f5f22;
            border: 4px solid #161a22;
            border-radius: 14px;
            box-shadow: 0 6px 0 rgba(0,0,0,.35);
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(90deg, #ffc83d 0 18px, #ffd76a 18px 36px);
            transition: width 0.3s ease;
        }
        #loading-title {
            margin: 0; position: relative; text-align: center; max-width: 92vw;
            font: 900 clamp(38px, 10vw, 86px)/0.95 RushFont, 'Arial Black', system-ui, sans-serif;
            color: #ffc83d; letter-spacing: .02em; transform: rotate(-3deg) skewX(-6deg);
            -webkit-text-stroke: clamp(5px, 1.2vw, 9px) #161a22; paint-order: stroke fill;
            text-shadow: 0 clamp(5px, 1vw, 9px) 0 #161a22;
        }
        #loading-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        .loading-logo { width: min(88vw, 600px); max-height: 35vh; object-fit: contain; position: relative; }
        .engine-mark { width: clamp(64px, 12vh, 112px); height: clamp(64px, 12vh, 112px); object-fit: contain; position: relative; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
        .loading-runner { position: relative; width: 46px; height: 70px; animation: rv-bob .32s ease-in-out infinite alternate; }
        .loading-runner i { position: absolute; display: block; border: 3px solid #161a22; border-radius: 4px; }
        .loading-runner .h { left: 10px; top: 0; width: 20px; height: 18px; background: #ffc59b; border-radius: 8px; }
        .loading-runner .t { left: 6px; top: 20px; width: 28px; height: 26px; background: #ff8a1f; }
        .loading-runner .l1, .loading-runner .l2 { top: 46px; width: 12px; height: 22px; background: #73384e; transform-origin: 50% 0; }
        .loading-runner .l1 { left: 7px; animation: rv-leg .32s ease-in-out infinite alternate; }
        .loading-runner .l2 { left: 21px; animation: rv-leg .32s ease-in-out infinite alternate-reverse; }
        @keyframes rv-bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        @keyframes rv-leg { from { transform: rotate(32deg); } to { transform: rotate(-32deg); } }
        #loading-percent { font: 900 18px RushFont, system-ui, sans-serif; color: #fff; position: relative; -webkit-text-stroke: 4px #161a22; paint-order: stroke fill; }
        #loading-retry { position: relative; padding: 12px 28px; border: 4px solid #161a22; border-radius: 14px; background: #34e27a; color: #161a22; font: 900 18px RushFont, system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
        #loading-retry:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <div class="loading-cloud c1" aria-hidden="true"></div><div class="loading-cloud c2" aria-hidden="true"></div>
        <h1 id="loading-title">Салки в долине</h1>
        <img class="loading-logo" src="assets/ui/logo-pikabu.webp" alt="" draggable="false" aria-hidden="true">
        <div class="loading-runner" aria-hidden="true"><i class="l1"></i><i class="l2"></i><i class="t"></i><i class="h"></i></div>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading"></div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->
    <script src="https://games.pikabu.ru/sdk/sdk.js"></script>
<script src="js/Constants.js?v=0.1.4"></script>
    <script src="libs/simplex-noise.js?v=0.1.4"></script>
    <script src="libs/babylon.js?v=0.1.4"></script>
    <script src="js/Maps.js?v=0.1.4"></script>
    <script src="js/Maps2D.js?v=0.1.4"></script>
    <script src="js/World2D.js?v=0.1.4"></script>
    <script src="js/World3D.js?v=0.1.4"></script>
    <script src="js/Terrain3D.js?v=0.1.4"></script>
    <script src="js/CameraControl.js?v=0.1.4"></script>
    <script src="js/Model3D.js?v=0.1.4"></script>
    <script src="js/ModelFBX.js?v=0.1.4"></script>
    <script src="js/ModelOBJ.js?v=0.1.4"></script>
    <script src="js/ModelGLTF.js?v=0.1.4"></script>
    <script src="js/Location3D.js?v=0.1.4"></script>
    <script src="js/Pause.js?v=0.1.4"></script>
    <script src="js/Sound.js?v=0.1.4"></script>
    <script src="js/Lang.js?v=0.1.4"></script>
    <script src="js/Platform.js?v=0.1.4"></script>
    <script src="js/PlatformPikabu.js?v=0.1.4"></script>
    <script src="js/LoadingScreen.js?v=0.1.4"></script>
    <script src="js/ParticleFX.js?v=0.1.4"></script>
    <!-- Скрипты игры (js/Game.js и её модули) — здесь, до main.js -->
    <script src="js/GameLang.js?v=0.1.4"></script>
    <script src="js/Cosmetics.js?v=0.1.4"></script>
    <script src="js/CosmeticIcons.js?v=0.1.4"></script>
    <script src="js/ArtAssets.js?v=0.1.4"></script>
    <script src="js/GameUI.js?v=0.1.4"></script>
    <script src="js/CharArt.js?v=0.1.4"></script>
    <script src="js/Characters.js?v=0.1.4"></script>
    <script src="js/Water.js?v=0.1.4"></script>
    <script src="js/Bots.js?v=0.1.4"></script>
    <script src="js/Match.js?v=0.1.4"></script>
    <script src="js/Game.js?v=0.1.4"></script>
    <script src="js/main.js?v=0.1.4"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
